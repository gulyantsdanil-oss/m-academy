name: M-academy pilot — checks
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/pilot-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/pilot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/pilot-app
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static SQL and security contracts
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Build Next.js pilot
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Smoke test production Next.js server and routes
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          PORT=3117 npm run start -- -p 3117 > /tmp/m-academy-pilot.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! node scripts/http-smoke.mjs http://127.0.0.1:3117; then
            echo "Server startup log (redacted environment not logged):"
            tail -n 70 /tmp/m-academy-pilot.log
            exit 1
          fi

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Build standalone Next.js image with disposable public test credentials
        run: |
          docker build --file backend/pilot-app/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://test-project.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_disposableci \
            --tag m-academy-pilot:ci backend/pilot-app
      - name: Run non-root container and test HTTP routes
        run: |
          set -euo pipefail
          docker run -d --name m-academy-pilot-ci -p 3118:3000 m-academy-pilot:ci
          trap 'docker rm -f m-academy-pilot-ci >/dev/null 2>&1 || true' EXIT
          node backend/pilot-app/scripts/http-smoke.mjs http://127.0.0.1:3118
          test "$(docker exec m-academy-pilot-ci id -u)" = 1001


  postgres-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academy_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: academy_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Prepare minimal auth schema (CI only)
        run: psql -v ON_ERROR_STOP=1 -f backend/pilot-app/tests/sql-auth-ci-bootstrap.sql
      - name: Apply ordered migrations to actual PostgreSQL
        run: |
          set -euo pipefail
          for migration in backend/supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify role isolation with synthetic teacher and student
        run: psql -v ON_ERROR_STOP=1 -f backend/pilot-app/tests/sql-rls-smoke.sql
      - name: Backup and restore test database
        run: |
          set -euo pipefail
          # Match pg_dump/pg_restore major version to the PostgreSQL 16 service.
          docker run --rm --network host -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -v /tmp:/backup postgres:16 pg_dump --format=custom --no-owner --file=/backup/m-academy-ci.dump
          createdb academy_restored
          docker run --rm --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -v /tmp:/backup postgres:16 pg_restore --no-owner --exit-on-error --dbname=academy_restored /backup/m-academy-ci.dump
          psql -v ON_ERROR_STOP=1 -d academy_restored -c "SELECT count(*) FROM public.schools;"
      - name: Verify recovered schema and RLS after restoration
        run: psql -v ON_ERROR_STOP=1 -d academy_restored -f backend/pilot-app/tests/sql-rls-smoke.sql
