name: M-academy pilot — checks
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/pilot-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/pilot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/pilot-app
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static SQL and security contracts
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Build Next.js pilot
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  postgres-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academy_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: academy_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Prepare minimal auth schema (CI only)
        run: psql -v ON_ERROR_STOP=1 -f backend/pilot-app/tests/sql-auth-ci-bootstrap.sql
      - name: Apply ordered migrations to actual PostgreSQL
        run: |
          set -euo pipefail
          for migration in backend/supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify role isolation with synthetic teacher and student
        run: psql -v ON_ERROR_STOP=1 -f backend/pilot-app/tests/sql-rls-smoke.sql
      - name: Backup and restore test database
        run: |
          set -euo pipefail
          pg_dump --format=custom --no-owner --file=/tmp/m-academy-ci.dump
          createdb academy_restored
          pg_restore --no-owner --exit-on-error --dbname=academy_restored /tmp/m-academy-ci.dump
          psql -v ON_ERROR_STOP=1 -d academy_restored -c "SELECT count(*) FROM public.schools;"
      - name: Verify recovered schema and RLS after restoration
        run: psql -v ON_ERROR_STOP=1 -d academy_restored -f backend/pilot-app/tests/sql-rls-smoke.sql
